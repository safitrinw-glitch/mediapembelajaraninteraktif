<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Teks Cerita Fantasi — MPI Bahasa Indonesia Kelas VII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SISTEM DESAIN — "Cinematic 3D Family Fantasy"
   ============================================================ */
:root{
  --gold:#FFC857;  --gold-d:#C47600;  --gold-l:#FFE08A;
  --violet:#7C5CFC; --violet-d:#4B2FB0;
  --teal:#3FE0C8;  --teal-d:#12897A;
  --pink:#FF7AB6;
  --cream:#FFF6E6;
  --ink:#0D0726;
  --danger:#FF6B6B;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:radial-gradient(circle at 50% 40%, #1b0f3e 0%, #07031a 70%);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;color:#fff;
  -webkit-font-smoothing:antialiased;
}

/* ---------- PANGGUNG 16:9 ---------- */
.stage{
  position:relative;
  width:min(97vw, calc(95vh * 16 / 9));
  height:min(95vh, calc(97vw * 9 / 16));
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.09), 0 0 90px rgba(124,92,252,.28);
  container-type:size;
  background:#150B33;
}

/* ---------- LATAR SINEMATIK 3D (berlapis) ---------- */
.bgart{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.bgveil{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 105%, rgba(10,4,28,.92), transparent 70%),
    radial-gradient(ellipse 60% 40% at 78% 12%, rgba(255,200,120,.20), transparent 65%),
    linear-gradient(180deg, rgba(8,3,26,.45) 0%, rgba(8,3,26,.10) 30%, rgba(8,3,26,.62) 100%);
}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.spark{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle, #FFF6D0 0%, #FFC857 45%, rgba(255,200,87,0) 72%);
  animation:drift linear infinite;opacity:0;
}
@keyframes drift{
  0%{transform:translateY(0) scale(.6);opacity:0;}
  12%{opacity:.95;}
  88%{opacity:.7;}
  100%{transform:translateY(-115%) scale(1.25);opacity:0;}
}

/* ---------- LAPISAN UI ---------- */
.ui{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  font-size:clamp(11px, 1.36cqw, 25px);
}

/* ---------- TOPBAR ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.55em 1.2em;flex:0 0 auto;z-index:30;
  background:linear-gradient(180deg, rgba(12,6,32,.82), rgba(12,6,32,0));
}
.tb-left{display:flex;align-items:center;gap:.5em;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.92em;letter-spacing:.3px;color:#E9DEFF;}
.tb-logo{font-size:1.25em;filter:drop-shadow(0 .12em .18em rgba(0,0,0,.6));}

/* ---------- AREA SCREEN ---------- */
.screens{position:relative;flex:1 1 auto;min-height:0;}
.screen{
  position:absolute;inset:0;
  padding:.9em 1.6em 1.3em;
  overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
  animation:screenIn .5s cubic-bezier(.2,.9,.3,1.2) both;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;
}
.screen::-webkit-scrollbar{width:7px;}
.screen::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:9px;}
@keyframes screenIn{from{opacity:0;transform:translateY(1.2em) scale(.985);}to{opacity:1;transform:none;}}

/* ---------- TOMBOL 3D ---------- */
.btn{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1em;
  padding:.62em 1.5em;border:none;border-radius:.85em;cursor:pointer;
  color:#3A1D00;letter-spacing:.3px;white-space:nowrap;
  background:linear-gradient(180deg,#FFE9A9 0%, #FFC857 45%, #FFA51F 100%);
  box-shadow:0 .30em 0 var(--gold-d), 0 .75em 1.5em rgba(255,165,31,.42), inset 0 .09em 0 rgba(255,255,255,.85);
  transform:translateY(0);transition:transform .12s, box-shadow .12s, filter .12s;
}
.btn:hover{transform:translateY(-.14em);filter:brightness(1.06);box-shadow:0 .42em 0 var(--gold-d), 0 .95em 1.9em rgba(255,165,31,.55), inset 0 .09em 0 rgba(255,255,255,.85);}
.btn:active{transform:translateY(.20em);box-shadow:0 .08em 0 var(--gold-d), 0 .3em .8em rgba(255,165,31,.4), inset 0 .09em 0 rgba(255,255,255,.7);}
.btn.big{font-size:1.18em;padding:.78em 2em;border-radius:1em;}
.btn.tiny{font-size:.8em;padding:.45em 1em;border-radius:.7em;}
.btn.violet{
  color:#fff;background:linear-gradient(180deg,#B7A2FF 0%, #7C5CFC 48%, #5A36D6 100%);
  box-shadow:0 .30em 0 var(--violet-d), 0 .75em 1.5em rgba(124,92,252,.5), inset 0 .09em 0 rgba(255,255,255,.5);
}
.btn.violet:hover{box-shadow:0 .42em 0 var(--violet-d), 0 .95em 1.9em rgba(124,92,252,.62), inset 0 .09em 0 rgba(255,255,255,.5);}
.btn.violet:active{box-shadow:0 .08em 0 var(--violet-d), 0 .3em .8em rgba(124,92,252,.4), inset 0 .09em 0 rgba(255,255,255,.4);}
.btn.teal{
  color:#00251F;background:linear-gradient(180deg,#A6FBEC 0%, #3FE0C8 48%, #16B7A2 100%);
  box-shadow:0 .30em 0 var(--teal-d), 0 .75em 1.5em rgba(63,224,200,.42), inset 0 .09em 0 rgba(255,255,255,.75);
}
.btn.teal:active{box-shadow:0 .08em 0 var(--teal-d), 0 .3em .8em rgba(63,224,200,.4), inset 0 .09em 0 rgba(255,255,255,.6);}
.btn.ghost{
  color:#EFE6FF;background:rgba(255,255,255,.09);
  box-shadow:0 .22em 0 rgba(0,0,0,.35), inset 0 0 0 .08em rgba(255,255,255,.22);
  backdrop-filter:blur(8px);
}
.btn.ghost:hover{background:rgba(255,255,255,.17);}

/* ---------- PANEL KACA ---------- */
.panel{
  background:linear-gradient(158deg, rgba(46,29,95,.86) 0%, rgba(20,11,48,.92) 100%);
  border-radius:1.1em;
  box-shadow:0 1.1em 2.6em rgba(0,0,0,.5), inset 0 .08em 0 rgba(255,255,255,.18), inset 0 0 0 .06em rgba(255,255,255,.09);
  backdrop-filter:blur(14px);
}
.panel.gold{
  background:linear-gradient(158deg, rgba(90,58,12,.78), rgba(40,22,6,.9));
  box-shadow:0 1.1em 2.6em rgba(0,0,0,.5), inset 0 .08em 0 rgba(255,224,160,.35), inset 0 0 0 .06em rgba(255,200,87,.35);
}
.panel.teal{
  background:linear-gradient(158deg, rgba(10,74,70,.78), rgba(6,32,36,.9));
  box-shadow:0 1.1em 2.6em rgba(0,0,0,.5), inset 0 .08em 0 rgba(180,255,240,.3), inset 0 0 0 .06em rgba(63,224,200,.3);
}

/* ---------- TIPOGRAFI ---------- */
h1,h2,h3,h4{font-family:'Baloo 2',sans-serif;line-height:1.08;letter-spacing:.2px;}
.h-section{
  font-size:1.5em;font-weight:800;
  background:linear-gradient(180deg,#FFF7DF,#FFC857 62%,#FF9F1C);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .06em .1em rgba(0,0,0,.55));
}
.eyebrow{
  display:inline-block;font-family:'Baloo 2',sans-serif;font-weight:700;
  font-size:.72em;letter-spacing:.16em;text-transform:uppercase;
  color:#FFD98A;padding:.35em .9em;border-radius:99em;
  background:rgba(255,200,87,.12);box-shadow:inset 0 0 0 1px rgba(255,200,87,.4);
}
p,li{line-height:1.5;}

/* ============================================================
   COVER
   ============================================================ */
.cover{
  flex-direction:row;align-items:center;gap:1.5em;
  padding:1.4em 2.6em;
}
.cover-left{flex:1 1 58%;display:flex;flex-direction:column;gap:.85em;align-items:flex-start;}
.cover h1{font-size:2.55em;font-weight:800;line-height:.98;}
.cover .t1{
  display:block;color:#fff;
  text-shadow:0 .05em 0 rgba(0,0,0,.35), 0 .12em .35em rgba(0,0,0,.6);
}
.cover .t2{
  display:block;
  background:linear-gradient(180deg,#FFF6D0 0%, #FFC857 45%, #FF8A3D 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .06em .12em rgba(0,0,0,.7));
}
.tagline{font-size:.98em;color:#DCD2F5;max-width:32em;line-height:1.55;}
.meta{font-size:.76em;color:#9C8FC9;letter-spacing:.5px;}
.cover-right{flex:1 1 42%;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;}
.char-halo{
  position:absolute;width:74%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, rgba(124,92,252,.55) 0%, rgba(63,224,200,.22) 45%, transparent 72%);
  filter:blur(14px);animation:pulse 4.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.13);opacity:1;}}
.char-wrap{position:relative;width:100%;max-width:19em;}
.nara-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 1em 1.5em rgba(0,0,0,.55));animation:bob 3.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg);}50%{transform:translateY(-.65em) rotate(.6deg);}}
.float-obj{
  position:absolute;font-size:2.1em;
  filter:drop-shadow(0 .2em .3em rgba(0,0,0,.55));
  animation:floatObj 5s ease-in-out infinite;
}
.float-obj.o1{top:6%;left:2%;animation-delay:.2s;}
.float-obj.o2{top:2%;right:8%;font-size:1.6em;animation-delay:1.1s;}
.float-obj.o3{bottom:10%;right:0%;animation-delay:2.1s;}
@keyframes floatObj{0%,100%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(-.9em) rotate(8deg);}}

/* ============================================================
   DASHBOARD
   ============================================================ */
.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8em;flex:0 0 auto;}
.dash-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.85em;
  flex:1 1 auto;align-content:center;
}
.tile{
  position:relative;border-radius:1em;padding:1em 1.1em;cursor:pointer;
  display:flex;flex-direction:column;gap:.35em;justify-content:center;
  background:linear-gradient(160deg, rgba(58,36,120,.9), rgba(22,12,52,.94));
  box-shadow:0 .85em 1.8em rgba(0,0,0,.45), inset 0 .08em 0 rgba(255,255,255,.16), inset 0 0 0 .06em rgba(255,255,255,.09);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.4), box-shadow .18s, filter .18s;
  overflow:hidden;
}
.tile::after{
  content:"";position:absolute;inset:0;border-radius:1em;pointer-events:none;
  background:radial-gradient(circle at 20% 0%, rgba(255,255,255,.16), transparent 55%);
}
.tile:hover{transform:translateY(-.32em) scale(1.022);filter:brightness(1.1);
  box-shadow:0 1.4em 2.6em rgba(0,0,0,.55), inset 0 .08em 0 rgba(255,255,255,.24), inset 0 0 0 .06em rgba(255,255,255,.14);}
.tile:active{transform:translateY(-.1em) scale(.99);}
.tile .ic{font-size:1.85em;line-height:1;filter:drop-shadow(0 .16em .22em rgba(0,0,0,.6));}
.tile .tt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.02em;color:#FFF6E6;line-height:1.15;}
.tile .ds{font-size:.74em;color:#B9ABE0;line-height:1.35;}
.tile.t-gold{background:linear-gradient(160deg, rgba(120,78,14,.92), rgba(52,28,6,.96));}
.tile.t-teal{background:linear-gradient(160deg, rgba(12,92,84,.92), rgba(6,38,40,.96));}
.tile.t-pink{background:linear-gradient(160deg, rgba(122,26,78,.92), rgba(48,10,34,.96));}
.dash-foot{display:flex;justify-content:center;gap:.7em;margin-top:.8em;flex:0 0 auto;}

/* ============================================================
   KONTEN UMUM
   ============================================================ */
.page-title{display:flex;align-items:center;gap:.6em;margin-bottom:.65em;flex:0 0 auto;}
.page-title .h-section{font-size:1.42em;}
.cols{display:flex;gap:1em;flex:1 1 auto;min-height:0;}
.col-l{flex:0 0 27%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5em;}
.col-r{flex:1 1 auto;display:flex;flex-direction:column;gap:.7em;min-width:0;}

.card{
  border-radius:.95em;padding:.9em 1.1em;
  background:linear-gradient(158deg, rgba(46,29,95,.86), rgba(20,11,48,.92));
  box-shadow:0 .7em 1.7em rgba(0,0,0,.42), inset 0 .08em 0 rgba(255,255,255,.16), inset 0 0 0 .06em rgba(255,255,255,.08);
}
.card h4{font-size:1.02em;color:#FFD98A;margin-bottom:.28em;display:flex;align-items:center;gap:.4em;}
.card p,.card li{font-size:.86em;color:#DCD2F5;}
.card ul{margin-left:1.1em;display:flex;flex-direction:column;gap:.22em;}
.card b{color:#FFE9A9;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7em;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;}

.chip{
  display:inline-flex;align-items:center;gap:.35em;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.76em;
  padding:.3em .8em;border-radius:99em;color:#FFE9A9;
  background:rgba(255,200,87,.13);box-shadow:inset 0 0 0 1px rgba(255,200,87,.38);
}

/* ============================================================
   KUIS / MISI
   ============================================================ */
.quiz-top{display:flex;align-items:center;gap:.8em;margin-bottom:.7em;flex:0 0 auto;}
.progress-track{flex:1 1 auto;height:.75em;border-radius:99em;background:rgba(255,255,255,.13);overflow:hidden;box-shadow:inset 0 .12em .25em rgba(0,0,0,.5);}
.progress-fill{
  height:100%;border-radius:99em;width:0%;
  background:linear-gradient(90deg,#3FE0C8,#7C5CFC 55%,#FFC857);
  box-shadow:0 0 .8em rgba(124,92,252,.85), inset 0 .1em 0 rgba(255,255,255,.5);
  transition:width .5s cubic-bezier(.3,1,.4,1);
}
.progress-label{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.84em;color:#FFD98A;white-space:nowrap;}

.q-card{
  border-radius:1em;padding:1em 1.3em;
  background:linear-gradient(158deg, rgba(48,30,100,.9), rgba(20,11,48,.94));
  box-shadow:0 .9em 2em rgba(0,0,0,.48), inset 0 .08em 0 rgba(255,255,255,.18), inset 0 0 0 .06em rgba(255,255,255,.1);
  flex:0 0 auto;
}
.q-text{font-size:1em;font-weight:800;color:#FFF6E6;line-height:1.45;}
.q-quote{
  font-size:.84em;color:#CBD8F0;font-style:italic;line-height:1.5;
  padding:.6em .9em;margin-top:.5em;border-radius:.7em;
  background:rgba(63,224,200,.10);border-left:.22em solid var(--teal);
}

.opts{display:grid;gap:.55em;margin-top:.85em;flex:0 0 auto;}
.opts.two{grid-template-columns:1fr 1fr;}
.opt{
  display:flex;align-items:center;gap:.7em;text-align:left;
  padding:.72em .95em;border-radius:.8em;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:.9em;font-weight:700;color:#EDE5FF;
  background:linear-gradient(160deg, rgba(66,44,132,.92), rgba(30,17,68,.96));
  box-shadow:0 .42em 0 rgba(0,0,0,.42), 0 .8em 1.5em rgba(0,0,0,.35), inset 0 .07em 0 rgba(255,255,255,.14), inset 0 0 0 .055em rgba(255,255,255,.1);
  transition:transform .13s, box-shadow .13s, filter .13s;
  border:none;
}
.opt:hover{transform:translateY(-.16em);filter:brightness(1.13);
  box-shadow:0 .6em 0 rgba(0,0,0,.42), 0 1.1em 2em rgba(0,0,0,.45), inset 0 .07em 0 rgba(255,255,255,.2), inset 0 0 0 .055em rgba(255,255,255,.18);}
.opt:active{transform:translateY(.14em);box-shadow:0 .12em 0 rgba(0,0,0,.4), inset 0 .07em 0 rgba(255,255,255,.12);}
.opt .ltr{
  flex:0 0 auto;display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:.55em;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.92em;color:#2A1500;
  background:linear-gradient(180deg,#FFE9A9,#FFB020);
  box-shadow:0 .14em 0 var(--gold-d), inset 0 .06em 0 rgba(255,255,255,.8);
}
.opt.correct{
  background:linear-gradient(160deg, rgba(20,140,110,.96), rgba(8,58,52,.98));
  box-shadow:0 .42em 0 #0A5449, 0 .9em 2em rgba(63,224,200,.5), inset 0 .07em 0 rgba(200,255,240,.4);
  animation:popOk .45s ease;
}
.opt.correct .ltr{background:linear-gradient(180deg,#B6FFEF,#2FD6B6);box-shadow:0 .14em 0 #0A5449;}
.opt.wrong{
  background:linear-gradient(160deg, rgba(150,40,60,.96), rgba(60,12,26,.98));
  box-shadow:0 .42em 0 #6B1226, 0 .9em 2em rgba(255,107,107,.42), inset 0 .07em 0 rgba(255,200,200,.35);
  animation:shake .42s ease;
}
.opt.wrong .ltr{background:linear-gradient(180deg,#FFC7C7,#FF6B6B);box-shadow:0 .14em 0 #6B1226;}
.opt[disabled]{cursor:default;}
.opt[disabled]:hover{transform:none;filter:none;}
@keyframes popOk{0%{transform:scale(1);}45%{transform:scale(1.045);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}18%{transform:translateX(-.42em);}40%{transform:translateX(.36em);}62%{transform:translateX(-.24em);}82%{transform:translateX(.14em);}}

/* ---------- UMPAN BALIK ---------- */
.feedback{
  display:flex;gap:.7em;align-items:flex-start;
  padding:.8em 1em;border-radius:.85em;margin-top:.8em;
  font-size:.86em;line-height:1.45;font-weight:700;
  animation:screenIn .35s ease both;
}
.feedback.ok{background:linear-gradient(120deg, rgba(20,150,120,.35), rgba(10,60,55,.6));box-shadow:inset 0 0 0 .07em rgba(63,224,200,.6);color:#B6FFEF;}
.feedback.no{background:linear-gradient(120deg, rgba(160,50,70,.32), rgba(60,12,26,.6));box-shadow:inset 0 0 0 .07em rgba(255,140,140,.55);color:#FFD3D3;}

/* ---------- BINTANG MISI ---------- */
.gems{display:flex;gap:.35em;flex-wrap:wrap;margin-bottom:.6em;}
.gem{
  width:1.55em;height:1.55em;border-radius:.4em;display:grid;place-items:center;font-size:.8em;
  background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 .06em rgba(255,255,255,.16);
  transition:transform .3s, background .3s, box-shadow .3s;color:rgba(255,255,255,.28);
}
.gem.on{
  background:linear-gradient(180deg,#FFF0B8,#FFC857 60%,#FF9F1C);
  box-shadow:0 0 .9em rgba(255,200,87,.9), inset 0 .06em 0 rgba(255,255,255,.9);
  color:#5A3200;transform:scale(1.12);
}

/* ---------- HASIL ---------- */
.result-hero{display:flex;align-items:center;gap:1.4em;flex:0 0 auto;}
.score-ring{
  position:relative;flex:0 0 auto;width:8.2em;height:8.2em;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(from -90deg, #3FE0C8 0deg, #7C5CFC var(--deg,240deg), rgba(255,255,255,.11) var(--deg,240deg));
  box-shadow:0 1.1em 2.4em rgba(0,0,0,.55), inset 0 0 0 .55em rgba(12,6,32,.92), 0 0 2.4em rgba(124,92,252,.55);
}
.score-ring .inner{text-align:center;}
.score-ring .num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.1em;line-height:1;
  background:linear-gradient(180deg,#FFF6D0,#FFC857);-webkit-background-clip:text;background-clip:text;color:transparent;}
.score-ring .lbl{font-size:.66em;color:#B9ABE0;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}

/* ---------- PENUTUP ---------- */
.credit-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-top:.7em;}
.credit{font-size:.8em;color:#DCD2F5;line-height:1.4;}
.credit b{display:block;color:#FFD98A;font-family:'Baloo 2',sans-serif;font-size:.95em;}

.center{display:flex;align-items:center;justify-content:center;text-align:center;}
.stack{display:flex;flex-direction:column;gap:.7em;}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;}

@media (max-width:820px){
  .cover{flex-direction:column;padding:1em;text-align:center;}
  .cover-left{align-items:center;flex:1 1 auto;}
  .cover h1{font-size:1.9em;}
  .dash-grid{grid-template-columns:1fr 1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .opts.two{grid-template-columns:1fr;}
  .cols{flex-direction:column;}
  .col-l{flex:0 0 auto;}
  .result-hero{flex-direction:column;text-align:center;}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- ===== LATAR 3D SINEMATIK ===== -->
  <svg class="bgart" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1B1044"/>
        <stop offset="34%" stop-color="#452A85"/>

  else if(pct >= 55){ kategori = 'Cukup Baik 👍'; saran = 'Ulangi Materi 2 (Struktur) dan Materi 3 (Kebahasaan), lalu coba kuis sekali lagi.'; }
  else { kategori = 'Semangat Terus! 💪'; saran = 'Ayo pelajari kembali Materi 1, 2, dan 3 dari awal, lalu ulangi Misi Interaktif sebelum kuis.'; }

  return `

        <div class="score-ring" style="--deg:${deg}deg;">

/* ============================================================
   8. LOGIKA MISI
   ============================================================ */
function misiAnswer(i){
  if(state.misiLocked) return;
  const q = MISI[state.misiIndex];
  state.misiPicked = i;
  if(i === q.benar){
    state.misiStars[state.misiIndex] = 1;
    state.misiFeedback = 'benar';
    state.misiLocked = true;
  } else {
    state.misiFeedback = 'salah';
  }
  render();
}

function misiNext(){
  state.misiLocked = false;
  state.misiFeedback = null;
  state.misiPicked = null;
  if(state.misiIndex < MISI.length - 1){
    state.misiIndex++;
  } else {
    state.misiDone = true;
  }
  render();
}

function resetMisi(){
  state.misiIndex = 0;
  state.misiDone = false;
  state.misiLocked = false;
  state.misiFeedback = null;
  state.misiPicked = null;
  state.misiStars = new Array(MISI.length).fill(0);
  render();
}

/* ============================================================
   9. LOGIKA EVALUASI
   ============================================================ */
function startEval(){
  state.evalIndex = 0;
  state.evalFirst = {};
  state.evalFeedback = null;
  state.evalPicked = null;
  state.evalLocked = false;
  nav('evalQ');
}

function answerEval(i){
  if(state.evalLocked) return;
  const q = EVAL[state.evalIndex];
  state.evalPicked = i;
  state.evalLocked = true;

  if(state.evalFirst[state.evalIndex] === undefined){
    state.evalFirst[state.evalIndex] = (i === q.benar);
  }

  // Tampilkan warna sebentar lalu pindah ke slide respons
  render();
  setTimeout(() => {
    state.screen = (i === q.benar) ? 'evalBenar' : 'evalSalah';
    render();
  }, 480);
}

function nextEval(){
  state.evalIndex++;
  state.evalLocked = false;
  state.evalPicked = null;
  state.screen = 'evalQ';
  render();
}

function retryEval(){
  state.evalLocked = false;
  state.evalPicked = null;
  state.screen = 'evalQ';
  render();
}

function restartEval(){ startEval(); }

/* ============================================================
   10. RENDER
   ============================================================ */
function renderTopbar(){
  const tb = $('topbar');
  if(state.screen === 'cover'){
    tb.style.display = 'none';
    tb.innerHTML = '';
    return;
  }
  tb.style.display = 'flex';
  tb.innerHTML = `
    <div class="tb-left">
      <span class="tb-logo">🐉</span>
      <span>Petualangan Teks Cerita Fantasi</span>
    </div>
    <div class="row">
      <button class="btn ghost tiny" onclick="nav('dashboard')">🏠 Beranda</button>
    </div>`;
}

function render(){
  const host = $('screens');
  const fn = SCREENS[state.screen] || SCREENS.cover;
  host.innerHTML = fn();
  renderTopbar();
  const sc = host.querySelector('.screen');
  if(sc) sc.scrollTop = 0;
}

/* ============================================================
   11. INISIALISASI
   ============================================================ */
sparkles();
render();
</script>
